<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASTFOODRD</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body class="bg-gradient-to-b from-yellow-100 via-yellow-200 to-yellow-100 font-poppins">

<header class="bg-red-600 text-white p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-2xl font-bold">FASTFOODRD</h1>
    <nav class="space-x-4">
        <a href="#inicio" class="hover:text-yellow-300">Inicio</a>
        <a href="#menu" class="hover:text-yellow-300">Pedidos</a>
        <a href="#pedido" class="hover:text-yellow-300">WhatsApp</a>
    </nav>
</header>

<section id="inicio" class="min-h-screen flex flex-col justify-center items-center text-center p-6">
    <h2 class="text-5xl font-extrabold text-red-600 mb-4">COMIDA RÁPIDA</h2>
    <p class="text-xl text-gray-700 mb-8">Hamburguesas, papas, hot dogs y refrescos.</p>
    <a href="#menu" class="bg-red-500 text-white font-bold px-8 py-4 rounded-lg hover:bg-red-600">
        ¡IR YA!
    </a>
</section>

<section id="menu" class="py-16 container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center mb-12 text-red-600">Nuestro Menú</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

        <!-- PRODUCTO 1 -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <img src="https://i.pinimg.com/1200x/01/2e/96/012e968d4f383a9f7a2d2d210ed6bff9.jpg" class="w-full h-56 object-cover">
            <div class="p-4 text-center">
                <h3 class="font-bold text-xl mb-2">Hamburguesa Clásica</h3>
                <span class="block text-red-600 font-bold mb-3">RD$250</span>
                <button onclick="addToCart('Hamburguesa Clásica',250)" class="bg-red-500 text-white px-5 py-2 rounded-full">
                    Agregar
                </button>
            </div>
        </div>

        <!-- PRODUCTO 2 -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <img src="https://i.pinimg.com/736x/94/bc/bf/94bcbf6cd773e3272563560cc650f02a.jpg" class="w-full h-56 object-cover">
            <div class="p-4 text-center">
                <h3 class="font-bold text-xl mb-2">Papas Supremas</h3>
                <span class="block text-red-600 font-bold mb-3">RD$180</span>
                <button onclick="addToCart('Papas Supremas',180)" class="bg-red-500 text-white px-5 py-2 rounded-full">
                    Agregar
                </button>
            </div>
        </div>

        <!-- PRODUCTO 3 -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <img src="https://i.pinimg.com/1200x/d2/a3/bd/d2a3bd9977664dcefbbeaf6dab1595c8.jpg" class="w-full h-56 object-cover">
            <div class="p-4 text-center">
                <h3 class="font-bold text-xl mb-2">Hot Dog Especial</h3>
                <span class="block text-red-600 font-bold mb-3">RD$150</span>
                <button onclick="addToCart('Hot Dog Especial',150)" class="bg-red-500 text-white px-5 py-2 rounded-full">
                    Agregar
                </button>
            </div>
        </div>

    </div>
</section>

<section id="pedido" class="py-16 container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center mb-8 text-red-600">Completa tu Pedido</h2>

    <div class="flex flex-col lg:flex-row gap-8">

        <!-- CARRITO -->
        <div class="w-full lg:w-1/2 bg-white p-6 rounded-lg shadow-lg">
            <h3 class="font-bold text-xl mb-4">Tu Carrito</h3>

            <!-- ESTE ERA EL FALTANTE -->
            <p id="cart-empty-msg" class="text-gray-500 text-center py-6">
                Tu carrito está vacío.
            </p>

            <div id="cart-items"></div>

            <div class="flex justify-between mt-4 font-bold">
                <span>Total</span>
                <span id="cart-total">RD$0</span>
            </div>
        </div>

        <!-- DATOS -->
        <div class="w-full lg:w-1/2 bg-white p-6 rounded-lg shadow-lg">
            <label class="font-bold block mb-2">Tu Nombre *</label>
            <input id="customer-name" class="w-full border p-2 mb-4 rounded"
                   oninput="this.value=this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g,'')">

            <label class="font-bold block mb-2">Tu Dirección *</label>
            <input id="customer-address" class="w-full border p-2 mb-4 rounded">

            <button onclick="sendWhatsAppOrder()" class="bg-green-500 text-white font-bold py-3 w-full rounded">
                Enviar Pedido
            </button>

            <p id="error-message" class="text-red-600 font-bold mt-4 hidden"></p>
        </div>

    </div>
</section>

<script src="script.js"></script>
</body>
</html>
